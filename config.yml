  baseURL: 'https://swkanwar.github.io/system-design-blog/'
  title: 'System Design'
  copyright: "© [System Design Contributors](https://github.com/swkanwar/system-design-blog/)"
  theme: [PaperMod]

  enableInlineShortcodes: true
  enableRobotsTXT: true
  buildDrafts: false
  buildFuture: false
  buildExpired: false
  enableEmoji: true
  pygmentsUseClasses: true
  mainsections: ["posts", "papermod"]

  minify:
    disableXML: true
    # minifyOutput: true

  pagination:
    disableAliases: false
    pagerSize: 3

  languages:
    en:
      languageName: "English"
      weight: 1
      taxonomies:
        category: categories
        tag: tags
        series: series
      menu:
        main:
          - name: About
            url: about
            weight: 1
          - name: Archive
            url: archives
            weight: 2
          - name: Search
            url: search/
            weight: 2
          - name: Tags
            url: tags/
            weight: 4
          - name: "Docs (Wiki)"
            url: https://github.com/adityatelange/hugo-PaperMod/wiki/

    fr:
      languageName: "French"
      weight: 2
      title: PaperModL2
      taxonomies:
        category: FRcategories
        tag: FRtags
        series: FRseries
      menu:
        main:
          - name: Archive
            url: archives/
            weight: 5
          - name: FRTags
            url: frtags
            weight: 10
          - name: FRCategories
            url: frcategories
            weight: 10
          - name: FRSeries
            url: frseries
            weight: 10
          - name: External
            url: "https://github.com/adityatelange/hugo-PaperMod/wiki/Features#profile-mode"

      # custom params for each language should be under [langcode].parms - hugo v0.120.0
      params:
        languageAltTitle: French
        profileMode:
          enabled: true
          title: PaperMod
          imageUrl: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&h=200"
          imageTitle: ProfileMode image
          # imageWidth: 120
          # imageHeight: 120
          subtitle: "☄️ Fast | ☁️ Fluent | 🌙 Smooth | 📱 Responsive"
          buttons:
            - name: Blog
              url: posts
            - name: Profile Mode
              url: https://github.com/adityatelange/hugo-PaperMod/wiki/Features#profile-mode


  outputFormats:
    llms:
      mediaType: "text/plain"
      baseName: "llms"
      isPlainText: true
      notAlternative: true

  outputs:
    home:
      - HTML
      - RSS
      - JSON
      - llms

  params:
    env: production # to enable google analytics, opengraph, twitter-cards and schema.
    description: "Theme PaperMod - https://github.com/adityatelange/hugo-PaperMod"
    author: Theme PaperMod
    # author: ["Me", "You"] # multiple authors

    defaultTheme: auto
    # disableThemeToggle: true
    ShowShareButtons: true
    ShowReadingTime: true
    # disableSpecial1stPost: true
    displayFullLangName: true
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    ShowRssButtonInSectionTermList: true
    ShowAllPagesInArchive: true
    ShowPageNums: true
    ShowToc: true
    # comments: false
    images: ["images/papermod-cover.png"]

    profileMode:
      enabled: false
      title: PaperMod
      imageUrl: "#"
      imageTitle: my image
      # imageWidth: 120
      # imageHeight: 120
      buttons:
        - name: Archives
          url: archives
        - name: Tags
          url: tags

    homeInfoParams:
      Title: "PaperMod's Demo"
      Content: |
        A clean, fast, and responsive Hugo theme built for a polished reading experience. [Read more..](/about/)
        - Lightweight by design, with a modern layout that keeps your content front and center.
        - Explore the [Docs (Wiki)](https://github.com/adityatelange/hugo-PaperMod/wiki/) to learn more about features and configuration.
        - Support the project on [GitHub](https://github.com/adityatelange/hugo-PaperMod) and share it with others who love minimalistic designs.
        - PaperMod is inspired by the [Paper](https://github.com/nanxiaobei/hugo-paper/tree/4330c8b12aa48bfdecbcad6ad66145f679a430b3) theme.

    socialIcons:
      - name: github
        title: View Source on Github
        url: "https://github.com/swkanwar/system-design-blog"
      - name: X
        title: Share PaperMod on X/Twitter
        url: "https://x.com/intent/tweet/?text=Checkout%20System%20Design%20Explained.&url=https://github.com/swkanwar/system-design-blog&hashtags=SystemDesign,InterviewPrep"

    editPost:
      URL: "https://github.com/swkanwar/system-design-blog"
      Text: "Suggest Changes" # edit text
      appendFilePath: true # to append file path to Edit link

    assets:
      disableHLJS: true
    #     favicon: "<link / abs url>"
    #     favicon16x16: "<link / abs url>"
    #     favicon32x32: "<link / abs url>"
    #     apple_touch_icon: "<link / abs url>"
    #     safari_pinned_tab: "<link / abs url>"

    # cover:
    #     hidden: true # hide everywhere but not in structured data
    #     hiddenInList: true # hide on list pages and home
    #     hiddenInSingle: true # hide on single page

    # fuseOpts:
    #     isCaseSensitive: false
    #     shouldSort: true
    #     location: 0
    #     distance: 1000
    #     threshold: 0.4
    #     minMatchCharLength: 0
    #     keys: ["title", "permalink", "summary", "content"]

  markup:
    goldmark:
      renderer:
        unsafe: true
    highlight:
      noClasses: false
      # anchorLineNos: true
      # codeFences: true
      # guessSyntax: true
      # lineNos: true
      # style: monokai

  # privacy:
  #   vimeo:
  #     disabled: false
  #     simple: true

  #   twitter:
  #     disabled: false
  #     enableDNT: true
  #     simple: true

  #   instagram:
  #     disabled: false
  #     simple: true

  #   youtube:
  #     disabled: false
  #     privacyEnhanced: true

  services:
    instagram:
      disableInlineCSS: true
    x:
      disableInlineCSS: true